# Shortcutter — zet dit bestand op je server en start met:
#   docker compose pull && docker compose up -d
#   docker compose logs shortcutter      # hier staat de eenmalige setupcode
# Open daarna http://<server>:8000/setup
#
# Er staan bewust GEEN sleutels of wachtwoorden in dit bestand: API-sleutels voeg je
# toe in het dashboard (API-sleutels), waar ze versleuteld worden opgeslagen.
services:
  shortcutter:
    image: ghcr.io/iitssjstn/shortcutter:latest
    build: .
    container_name: shortcutter
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - whisper-cache:/cache
    environment:
      WHISPER_MODEL: small        # tiny | base | small | medium | large-v3 (ook te wijzigen in Instellingen)
      WHISPER_DEVICE: cpu         # cpu of cuda
      WHISPER_COMPUTE: int8       # int8 (cpu), float16 (cuda)
      # Oude CPU? De app detecteert dit zelf en valt bij een crash terug op een veilige modus.
      # Handmatig forceren kan met: CT2_FORCE_CPU_ISA: GENERIC  (geen AVX), WHISPER_VAD: "false"
      # WHISPER_THREADS: "2"      # CPU-threads voor Whisper (0 = automatisch: helft van de kernen, max. 4)
      # FFMPEG_THREADS: "2"       # CPU-threads per render (meer = sneller, maar meer geheugen)
      # PROCESS_NICE: "10"        # lagere voorrang voor renderen/transcriberen (0 = uit)
      COOKIE_SECURE: "false"      # "true" zodra de app achter HTTPS (reverse proxy) draait
      # UPLOAD_CONCURRENCY: "4"   # zoveel YouTube-uploads tegelijk (los van het verwerken van projecten)
      # PUBLIC_URL: "https://shorts.jouwdomein.nl"  # nodig voor de YouTube-koppeling (redirect-URL bij Google)
      # FORWARDED_ALLOW_IPS: "172.18.0.1"  # IP van je reverse proxy, voor het juiste client-IP
    # Grenzen zodat Shortcutter de rest van de server niet kan laten vastlopen. Raakt het geheugen
    # vol, dan stopt alleen die ene taak (met een melding), niet de hele server. Pas aan aan je server.
    mem_limit: 3g
    memswap_limit: 3g
    cpus: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Optioneel: master key als Docker secret in plaats van data/.master_key
    # secrets:
    #   - app_master_key

volumes:
  whisper-cache:

