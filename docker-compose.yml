# Shortcutter — zet dit bestand op je server en start met:
#   docker compose pull && docker compose up -d
#   docker compose logs shortcutter      # hier staat de eenmalige setupcode
# Open daarna http://<server>:8000/setup
#
# Er staan bewust GEEN sleutels of wachtwoorden in dit bestand: API-sleutels voeg je
# toe in het dashboard (API-sleutels), waar ze versleuteld worden opgeslagen.
services:
  shortcutter:
    image: ghcr.io/iitssjstn/shortcutter:latest
    build: .
    container_name: shortcutter
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - whisper-cache:/cache
    environment:
      WHISPER_MODEL: small        # tiny | base | small | medium | large-v3 (ook te wijzigen in Instellingen)
      WHISPER_DEVICE: cpu         # cpu of cuda
      WHISPER_COMPUTE: int8       # int8 (cpu), float16 (cuda)
      COOKIE_SECURE: "false"      # "true" zodra de app achter HTTPS (reverse proxy) draait
      # FORWARDED_ALLOW_IPS: "172.18.0.1"  # IP van je reverse proxy, voor het juiste client-IP
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Optioneel: master key als Docker secret in plaats van data/.master_key
    # secrets:
    #   - app_master_key

volumes:
  whisper-cache:

