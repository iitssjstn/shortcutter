{% set c = item.clip %}{% set est = item.est %}
<article class="clip-row" id="clip-{{ c.id }}">
  <div class="clip-head">
    <label class="clip-check-wrap" title="Selecteren voor download"><input type="checkbox" class="clip-check" value="{{ c.id }}" aria-label="Clip {{ c.index }} selecteren"></label>
    <button type="button" class="clip-toggle" aria-expanded="false" aria-controls="clip-panel-{{ c.id }}">
      <span class="clip-thumb">
        {% if c.thumb_path and c.status not in ('pending', 'rendering') %}<img src="/clips/{{ c.id }}/thumb" alt="" loading="lazy">{% endif %}
        <span class="clip-idx">#{{ c.index }}</span>
      </span>
      <span class="clip-main">
        <span class="clip-title">{{ c.title }}</span>
        <span class="clip-meta">
          {{ c.start|ts }} – {{ c.end|ts }} · {{ '%.0f'|format(c.duration) }} s
          {% if c.framing_mode %} · {{ {'crop': 'gevuld', 'blur': 'passend', 'vertical': 'staand', 'split': 'gesplitst'}.get(c.framing_mode, c.framing_mode) }}{% endif %}
          {% if c.source == 'heuristiek' %} · heuristiek{% elif c.source == 'handmatig' %} · handmatig{% endif %}
        </span>
      </span>
      <span class="clip-num"><span class="k">Score</span><span class="v">{{ c.viral_score }}</span></span>
      <span class="clip-num"><span class="k">Views (schatting)</span><span class="v">{{ fmt_views(est.low) }}–{{ fmt_views(est.high) }}</span></span>
      <span class="clip-state">
        {% if c.status == 'failed' %}<span class="badge badge-error">render mislukt</span>
        {% elif c.status in ('pending', 'rendering') %}<span class="badge badge-accent">renderen</span>
        {% elif c.yt_status == 'done' %}<span class="badge badge-ok">op YouTube</span>
        {% elif c.yt_status in ('queued', 'uploading') %}<span class="badge badge-accent">uploaden</span>
        {% elif c.posted_at %}<span class="badge badge-ok">gepost</span>
        {% else %}<span class="badge">klaar</span>{% endif %}
      </span>
      <span class="clip-chevron" aria-hidden="true"></span>
    </button>
    <a class="btn clip-edit-btn" href="/clips/{{ c.id }}/edit" title="Indeling (facecam/gameplay) en ondertitels aanpassen">✎ Bewerken</a>
  </div>

  <div class="clip-panel" id="clip-panel-{{ c.id }}">
    <div class="clip-panel-inner">
      {% if render_panel %}{% include "partials/clip_panel.html" %}{% else %}
      <div class="clip-panel-lazy" data-src="/clips/{{ c.id }}/panel"><p class="muted" style="padding:1rem;margin:0">Laden…</p></div>
      {% endif %}
    </div>
  </div>
</article>
